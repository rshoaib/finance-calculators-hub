<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The 4 percent rule for retirement withdrawals in 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3a5f"/>
      <stop offset="100%" stop-color="#1d6fa5"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>
  <g transform="translate(70,90)">
    <text x="0" y="0" fill="#ffd166" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">RETIREMENT &#8226; 2026 GUIDE</text>
    <text x="0" y="70" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="800">The 4% Rule</text>
    <text x="0" y="130" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="40" font-weight="600">Does it still work in 2026?</text>
    <text x="0" y="190" fill="#cfe6f7" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="400">Bengen&apos;s safemax, the Trinity Study, and a sane plan for your withdrawals.</text>
  </g>
  <g transform="translate(720,330)">
    <rect x="0" y="60" width="80" height="160" fill="url(#bar)" rx="6"/>
    <rect x="100" y="40" width="80" height="180" fill="url(#bar)" rx="6"/>
    <rect x="200" y="20" width="80" height="200" fill="url(#bar)" rx="6"/>
    <rect x="300" y="0" width="80" height="220" fill="url(#bar)" rx="6"/>
    <text x="0" y="245" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="600">3.3%</text>
    <text x="100" y="245" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="600">3.7%</text>
    <text x="200" y="245" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="600">3.9%</text>
    <text x="300" y="245" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="600">4.7%</text>
    <text x="0" y="-10" fill="#cfe6f7" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" letter-spacing="1">SAFE STARTING WITHDRAWAL RATES</text>
  </g>
  <g transform="translate(70,540)">
    <circle cx="14" cy="14" r="14" fill="#ffd166"/>
    <text x="40" y="20" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="600">MyCalcFinance</text>
  </g>
</svg>
