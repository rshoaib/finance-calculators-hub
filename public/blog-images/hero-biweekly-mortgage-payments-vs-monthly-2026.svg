<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Biweekly vs monthly mortgage payments: the interest-savings story">
  <defs>
    <linearGradient id="bgBi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="barMonthly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="barBiweekly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgBi)"/>
  <g stroke="#1e293b" stroke-opacity="0.6">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>
  <g transform="translate(70,150)" fill="#38bdf8">
    <path d="M0 110 L100 20 L200 110 L200 210 L130 210 L130 150 L70 150 L70 210 L0 210 Z" opacity="0.9"/>
    <rect x="85" y="45" width="30" height="30" fill="#0f172a"/>
  </g>
  <text x="320" y="140" font-family="Georgia,serif" font-size="56" fill="#f8fafc" font-weight="700">Biweekly vs Monthly</text>
  <text x="320" y="200" font-family="Georgia,serif" font-size="36" fill="#cbd5f5">Mortgage Payments in 2026</text>
  <g transform="translate(320,270)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="22" fill="#cbd5f5">$400,000 loan · 30-yr fixed · 6.30% APR</text>
    <g transform="translate(0,40)">
      <rect x="0" y="0" width="720" height="46" rx="6" fill="url(#barMonthly)"/>
      <text x="16" y="30" font-family="Arial,sans-serif" font-size="20" fill="#fff" font-weight="700">Standard monthly · $491,321 interest · 30 years</text>
    </g>
    <g transform="translate(0,110)">
      <rect x="0" y="0" width="561" height="46" rx="6" fill="url(#barBiweekly)"/>
      <text x="16" y="30" font-family="Arial,sans-serif" font-size="20" fill="#062019" font-weight="700">Biweekly · $382,475 interest · 24 yrs 4 mos</text>
    </g>
    <g transform="translate(0,180)">
      <text x="0" y="0" font-family="Arial,sans-serif" font-size="30" fill="#facc15" font-weight="800">Save ≈ $108,846 · Pay off ~5 yrs 8 mos early</text>
    </g>
  </g>
  <text x="320" y="560" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Rate per Freddie Mac PMMS, week of Apr 16, 2026. Illustrative — your numbers depend on loan terms and lender policy.</text>
  <text x="1100" y="600" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#64748b">MyCalcFinance</text>
</svg>
