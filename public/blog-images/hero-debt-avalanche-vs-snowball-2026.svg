<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title-debt-avalanche-vs-snowball-2026" style="width:100%;height:auto;border-radius:12px;margin:0 0 24px 0;display:block;">
  <title id="title-debt-avalanche-vs-snowball-2026">Debt Avalanche vs Snowball: Which Method Pays Off Debt Faster in 2026?</title>
  <defs>
    <linearGradient id="g" gradientTransform="rotate(124)">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.40" r="0.55">
      <stop offset="0%" stop-color="#e0e7ff" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#e0e7ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pat" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="26" fill="none" stroke="#e0e7ff" stroke-width="1.2" stroke-opacity="0.18"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#e0e7ff" stroke-width="1.2" stroke-opacity="0.18"/>
      <circle cx="80" cy="80" r="26" fill="none" stroke="#e0e7ff" stroke-width="1.2" stroke-opacity="0.18"/>
    </pattern>
    <linearGradient id="bar1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#pat)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="960" cy="315" r="210" fill="#e0e7ff" fill-opacity="0.08"/>
  <circle cx="960" cy="315" r="150" fill="#e0e7ff" fill-opacity="0.12"/>

  <!-- Descending/ascending bars: a visual of debts getting knocked down -->
  <g transform="translate(820 140)">
    <!-- Card 3 (tallest, back) -->
    <rect x="140" y="30" width="90" height="340" rx="10" fill="url(#bar1)" opacity="0.92"/>
    <rect x="150" y="55" width="60" height="10" rx="4" fill="#fff" fill-opacity="0.55"/>
    <rect x="150" y="80" width="40" height="8" rx="3" fill="#fff" fill-opacity="0.35"/>
    <!-- Card 2 (middle) -->
    <rect x="70" y="120" width="90" height="250" rx="10" fill="url(#bar2)" opacity="0.92"/>
    <rect x="80" y="145" width="60" height="10" rx="4" fill="#fff" fill-opacity="0.55"/>
    <rect x="80" y="170" width="40" height="8" rx="3" fill="#fff" fill-opacity="0.35"/>
    <!-- Card 1 (smallest, front) -->
    <rect x="0" y="210" width="90" height="160" rx="10" fill="url(#bar3)" opacity="0.92"/>
    <rect x="10" y="235" width="60" height="10" rx="4" fill="#fff" fill-opacity="0.55"/>
    <rect x="10" y="260" width="40" height="8" rx="3" fill="#fff" fill-opacity="0.35"/>
    <!-- Down arrow indicating payoff -->
    <g transform="translate(115 400)">
      <path d="M 0 0 L 20 20 L 40 0" stroke="#e0e7ff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>
    </g>
  </g>

  <!-- Headline copy -->
  <g transform="translate(80 170)">
    <text x="0" y="0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="600" fill="#e0e7ff" fill-opacity="0.85" letter-spacing="3">2026 GUIDE · DEBT PAYOFF</text>
    <text x="0" y="80" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="62" font-weight="800" fill="#ffffff">Avalanche vs. Snowball</text>
    <text x="0" y="150" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="500" fill="#e0e7ff" fill-opacity="0.92">Which method actually pays off</text>
    <text x="0" y="192" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="34" font-weight="500" fill="#e0e7ff" fill-opacity="0.92">$11K of card debt faster?</text>

    <!-- Stat chips -->
    <g transform="translate(0 240)">
      <rect x="0" y="0" width="240" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="28" y="33" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="600" fill="#ffffff">Avg APR: 22.30%</text>

      <rect x="258" y="0" width="250" height="52" rx="26" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="286" y="33" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="600" fill="#ffffff">Total US: $1.28T</text>
    </g>
  </g>

  <!-- Footer brand -->
  <g transform="translate(80 560)">
    <circle cx="12" cy="0" r="10" fill="#e0e7ff" fill-opacity="0.85"/>
    <text x="34" y="6" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="2">MYCALCFINANCE.COM</text>
  </g>
</svg>
