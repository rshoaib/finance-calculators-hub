<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Pay off mortgage early vs invest the difference in 2026" style="width:100%;height:auto;display:block;border-radius:12px;margin-bottom:1.25rem;">
  <defs>
    <linearGradient id="bgPMI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#1d4f7a"/>
    </linearGradient>
    <linearGradient id="barPay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="barInvest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgPMI)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>
  <g transform="translate(70,90)">
    <text x="0" y="0" fill="#fbbf24" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">MORTGAGE &#8226; 2026 GUIDE</text>
    <text x="0" y="70" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="800">Pay Off Mortgage</text>
    <text x="0" y="130" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="56" font-weight="800">vs Invest the Difference</text>
    <text x="0" y="190" fill="#cfe6f7" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="500">A 6.23% mortgage vs a 7% real stock return: who wins, and by how much?</text>
  </g>
  <g transform="translate(70,360)">
    <text x="0" y="0" fill="#cfe6f7" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="1">$50,000 EXTRA OVER 15 YEARS, ILLUSTRATIVE</text>
    <g transform="translate(0,30)">
      <rect x="0" y="0" width="320" height="46" rx="6" fill="url(#barPay)"/>
      <text x="14" y="30" font-family="Arial,sans-serif" font-size="18" fill="#ffffff" font-weight="700">Pay down mortgage &#8226; ~$71k saved interest</text>
    </g>
    <g transform="translate(0,90)">
      <rect x="0" y="0" width="540" height="46" rx="6" fill="url(#barInvest)"/>
      <text x="14" y="30" font-family="Arial,sans-serif" font-size="18" fill="#062019" font-weight="700">Invest in S&amp;P 500 &#8226; ~$138k portfolio at 7% real</text>
    </g>
    <g transform="translate(0,150)">
      <text x="0" y="0" font-family="Arial,sans-serif" font-size="22" fill="#fbbf24" font-weight="800">Math leans toward investing &#8212; behavior decides the rest.</text>
    </g>
  </g>
  <g transform="translate(70,580)">
    <circle cx="14" cy="14" r="14" fill="#fbbf24"/>
    <text x="40" y="20" fill="#ffffff" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600">MyCalcFinance</text>
  </g>
</svg>
