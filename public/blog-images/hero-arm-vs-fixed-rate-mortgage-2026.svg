<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="ARM vs fixed-rate mortgage comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="armLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="fixedBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity="0.08">
    <circle cx="1050" cy="120" r="180" fill="#ffffff"/>
    <circle cx="130" cy="520" r="150" fill="#ffffff"/>
  </g>
  <!-- Chart area -->
  <g transform="translate(90,120)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="340" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="340" x2="620" y2="340" stroke="#475569" stroke-width="2"/>
    <!-- Fixed-rate flat line -->
    <line x1="0" y1="160" x2="620" y2="160" stroke="url(#fixedBar)" stroke-width="6" stroke-linecap="round"/>
    <text x="635" y="165" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Fixed 6.23%</text>
    <!-- ARM stepped line: intro low, then adjustments -->
    <polyline points="0,230 240,230 240,170 370,170 370,100 500,100 500,60 620,60"
              fill="none" stroke="url(#armLine)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="635" y="65" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">ARM after resets</text>
    <text x="5" y="250" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">5.55% intro</text>
    <!-- Year labels -->
    <text x="0" y="370" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Yr 1</text>
    <text x="240" y="370" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Yr 5</text>
    <text x="370" y="370" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Yr 6</text>
    <text x="500" y="370" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Yr 7</text>
    <text x="595" y="370" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Yr 8+</text>
  </g>
  <!-- Title -->
  <g transform="translate(90,60)" font-family="Inter, Arial, sans-serif" fill="#f8fafc">
    <text x="0" y="0" font-size="38" font-weight="800">ARM vs Fixed-Rate Mortgage</text>
  </g>
  <g transform="translate(820,460)" font-family="Inter, Arial, sans-serif" fill="#f8fafc">
    <text x="0" y="0" font-size="22" font-weight="600" fill="#bfdbfe">Which saves you more?</text>
    <text x="0" y="34" font-size="22" font-weight="600" fill="#a7f3d0">Depends on your timeline.</text>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">mycalcfinance.com · 2026 Guide</text>
</svg>
