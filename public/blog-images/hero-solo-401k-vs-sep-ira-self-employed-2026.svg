<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Solo 401(k) vs SEP IRA in 2026" style="width:100%;height:auto;display:block;border-radius:12px;margin-bottom:1.25rem;">
  <defs>
    <linearGradient id="bgSolo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="soloBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="sepBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgSolo)"/>
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>
  <text x="60" y="110" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800">Solo 401(k) vs SEP IRA</text>
  <text x="60" y="170" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="500">2026 cap: $72,000 (both plans)</text>
  <g transform="translate(120,230)">
    <rect x="0" y="40" width="200" height="320" rx="12" fill="url(#soloBar)"/>
    <text x="100" y="20" fill="#a5f3fc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Solo 401(k)</text>
    <text x="100" y="200" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle">$24,500</text>
    <text x="100" y="230" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">employee</text>
    <text x="100" y="270" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">+ 20%</text>
    <text x="100" y="295" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">employer share</text>
    <text x="100" y="390" fill="#a5f3fc" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Roth option. Loans.</text>
  </g>
  <g transform="translate(420,300)">
    <rect x="0" y="40" width="200" height="250" rx="12" fill="url(#sepBar)"/>
    <text x="100" y="20" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">SEP IRA</text>
    <text x="100" y="200" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" text-anchor="middle">20%</text>
    <text x="100" y="230" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">of net SE income</text>
    <text x="100" y="320" fill="#fbcfe8" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Simpler paperwork.</text>
  </g>
  <g transform="translate(700,260)">
    <text x="0" y="40" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Same $72,000 ceiling.</text>
    <text x="0" y="85" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700">Very different paths.</text>
    <text x="0" y="150" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="22">Solo 401(k) usually saves more</text>
    <text x="0" y="182" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="22">under ~$200k net income.</text>
    <text x="0" y="215" fill="#cbd5e1" font-family="Inter, system-ui, sans-serif" font-size="22">SEP IRA wins on simplicity.</text>
  </g>
  <text x="60" y="590" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500">MyCalcFinance.com — Personal Finance Guides</text>
</svg>
