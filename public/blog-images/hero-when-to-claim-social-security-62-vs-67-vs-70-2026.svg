<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title-when-to-claim-ss-2026" style="width:100%;height:auto;border-radius:12px;margin:0 0 24px 0;display:block;">
  <title id="title-when-to-claim-ss-2026">When to Claim Social Security: 62 vs 67 vs 70 (2026 Math Guide)</title>
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(135)">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.22" r="0.6">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#5eead4" stroke-width="1" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="bar62" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bar67" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bar70" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Headline copy -->
  <g transform="translate(72 140)">
    <text x="0" y="0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="600" fill="#5eead4" letter-spacing="4">2026 GUIDE · RETIREMENT</text>
    <text x="0" y="82" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" fill="#f8fafc">When to Claim</text>
    <text x="0" y="154" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" fill="#f8fafc">Social Security</text>
    <text x="0" y="214" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="32" font-weight="500" fill="#a7f3d0">62 vs 67 vs 70 — the 2026 math</text>

    <!-- Stat chips -->
    <g transform="translate(0 260)">
      <rect x="0" y="0" width="220" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="24" y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="600" fill="#f8fafc">2026 COLA: 2.8%</text>

      <rect x="238" y="0" width="250" height="50" rx="25" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.22"/>
      <text x="262" y="32" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="19" font-weight="600" fill="#f8fafc">FRA = 67 (born 1960+)</text>
    </g>
  </g>

  <!-- Bar chart: % of FRA benefit at 62, 67, 70 -->
  <g transform="translate(780 160)">
    <text x="160" y="-14" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="600" fill="#cbd5e1">% of Full Retirement Age benefit</text>

    <!-- Baseline -->
    <line x1="-10" y1="280" x2="330" y2="280" stroke="#475569" stroke-width="2"/>

    <!-- 62 -->
    <rect x="20"  y="170" width="80" height="110" rx="8" fill="url(#bar62)"/>
    <text x="60"  y="160" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#f8fafc">70%</text>
    <text x="60"  y="310" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#fecaca">age 62</text>

    <!-- 67 -->
    <rect x="120" y="100" width="80" height="180" rx="8" fill="url(#bar67)"/>
    <text x="160" y="90"  text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#f8fafc">100%</text>
    <text x="160" y="310" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#fde68a">age 67</text>

    <!-- 70 -->
    <rect x="220" y="40"  width="80" height="240" rx="8" fill="url(#bar70)"/>
    <text x="260" y="30"  text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="800" fill="#f8fafc">124%</text>
    <text x="260" y="310" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="22" font-weight="700" fill="#bbf7d0">age 70</text>
  </g>

  <!-- Footer brand -->
  <g transform="translate(72 560)">
    <circle cx="12" cy="0" r="10" fill="#5eead4" fill-opacity="0.9"/>
    <text x="34" y="6" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="700" fill="#f8fafc" letter-spacing="2">MYCALCFINANCE.COM</text>
  </g>
</svg>
