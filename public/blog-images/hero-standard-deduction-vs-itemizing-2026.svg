<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Standard Deduction vs Itemizing in 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="vsBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.16" fill="none" stroke="#34d399" stroke-width="1">
    <path d="M0 520 L1200 520"/>
    <path d="M0 460 L1200 460"/>
    <path d="M0 400 L1200 400"/>
    <path d="M0 340 L1200 340"/>
    <path d="M0 280 L1200 280"/>
  </g>
  <text x="80" y="120" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" fill="#86efac" font-weight="600" letter-spacing="3">MYCALCFINANCE &#x2022; TAX 2026</text>
  <text x="80" y="210" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#ffffff">Standard Deduction</text>
  <g transform="translate(540,170)">
    <rect width="120" height="60" rx="14" fill="url(#vsBadge)"/>
    <text x="60" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="#0f172a">VS</text>
  </g>
  <text x="80" y="290" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#fde68a">Itemizing</text>
  <text x="80" y="345" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#bbf7d0">Which path saves you more on your 2026 federal taxes?</text>

  <g transform="translate(80,400)">
