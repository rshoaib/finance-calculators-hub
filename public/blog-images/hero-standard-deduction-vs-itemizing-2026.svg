    <text x="24" y="44" font-family="system-ui,sans-serif" font-size="20" fill="#fde68a" font-weight="700" letter-spacing="2">ITEMIZE IF...</text>
    <text x="24" y="86" font-family="system-ui,sans-serif" font-size="22" fill="#ffffff" font-weight="700">SALT + mortgage + giving</text>
    <text x="24" y="118" font-family="system-ui,sans-serif" font-size="22" fill="#ffffff" font-weight="700">&gt; your standard amount</text>
    <text x="24" y="156" font-family="system-ui,sans-serif" font-size="16" fill="#fef3c7">2026 SALT cap: $40,400</text>
