    <text x="24" y="44" font-family="system-ui,sans-serif" font-size="20" fill="#86efac" font-weight="700" letter-spacing="2">STANDARD DEDUCTION (2026)</text>
    <text x="24" y="92" font-family="system-ui,sans-serif" font-size="36" fill="#ffffff" font-weight="800">$16,100 single</text>
    <text x="24" y="132" font-family="system-ui,sans-serif" font-size="32" fill="#ffffff" font-weight="800">$32,200 MFJ</text>
    <text x="24" y="156" font-family="system-ui,sans-serif" font-size="16" fill="#a7f3d0">No receipts. No Schedule A.</text>
  </g>

  <g transform="translate(620,400)">
