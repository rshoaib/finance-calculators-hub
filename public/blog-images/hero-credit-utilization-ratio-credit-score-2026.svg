<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title-credit-utilization-ratio-credit-score-2026" style="width:100%;height:auto;border-radius:12px;margin:0 0 24px 0;display:block;">
  <title id="title-credit-utilization-ratio-credit-score-2026">Credit Utilization Ratio: How It Impacts Your Credit Score in 2026</title>
  <defs>
    <linearGradient id="cu-bg" gradientTransform="rotate(25)">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="cu-bar-good" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cu-bar-ok" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="cu-bar-bad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cu-bg)"/>
  <g fill="#ffffff" font-family="Inter, system-ui, sans-serif">
    <text x="80" y="130" font-size="52" font-weight="800" letter-spacing="-1">Credit Utilization Ratio</text>
    <text x="80" y="185" font-size="28" font-weight="500" opacity="0.85">How it shapes your FICO score in 2026</text>
  </g>
  <g transform="translate(80, 260)">
    <g>
      <text x="0" y="-12" fill="#a7f3d0" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">Under 10% — excellent</text>
      <rect x="0" y="0" width="140" height="34" rx="6" fill="url(#cu-bar-good)"/>
    </g>
    <g transform="translate(0, 70)">
      <text x="0" y="-12" fill="#fde68a" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">10% – 30% — acceptable</text>
      <rect x="0" y="0" width="380" height="34" rx="6" fill="url(#cu-bar-ok)"/>
    </g>
    <g transform="translate(0, 140)">
      <text x="0" y="-12" fill="#fecaca" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">Over 30% — score pressure</text>
      <rect x="0" y="0" width="700" height="34" rx="6" fill="url(#cu-bar-bad)"/>
    </g>
    <g transform="translate(0, 210)">
      <text x="0" y="-12" fill="#fca5a5" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600">Over 70% — significant damage</text>
      <rect x="0" y="0" width="980" height="34" rx="6" fill="url(#cu-bar-bad)" opacity="0.7"/>
    </g>
  </g>
  <g transform="translate(80, 560)" fill="#e5e7eb" font-family="Inter, system-ui, sans-serif" font-size="18">
    <text>mycalcfinance.com — free calculators and plain-English personal-finance guides</text>
