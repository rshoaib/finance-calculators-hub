<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" role="img" aria-label="Mortgage recast vs refinance comparison in 2026"><defs><linearGradient id="bgRecast" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#1e293b"/></linearGradient><linearGradient id="barRecast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="barRefi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="barStatus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#b91c1c"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bgRecast)"/><g stroke="#1e293b" stroke-opacity="0.55"><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="480" x2="1200" y2="480"/></g><g transform="translate(70,130)" fill="#38bdf8"><path d="M0 120 L110 20 L220 120 L220 230 L145 230 L145 160 L75 160 L75 230 L0 230 Z" opacity="0.9"/><rect x="95" y="50" width="30" height="30" fill="#0b1120"/></g><text x="340" y="120" font-family="Georgia,serif" font-size="54" fill="#f8fafc" font-weight="700">Recast vs Refinance</text><text x="340" y="172" font-family="Georgia,serif" font-size="32" fill="#cbd5f5">Lowering your mortgage payment in 2026</text><g transform="translate(340,220)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="20" fill="#cbd5f5">$380k balance · 7.25% current rate · $50k lump sum · Refi @ 6.30%</text><g transform="translate(0,36)"><rect x="0" y="0" width="700" height="42" rx="6" fill="url(#barStatus)"/><text x="14" y="28" font-family="Arial,sans-serif" font-size="19" fill="#fff" font-weight="700">Keep current loan · $2,645/mo · $0 upfront</text></g><g transform="translate(0,92)"><rect x="0" y="0" width="607" height="42" rx="6" fill="url(#barRecast)"/><text x="14" y="28" font-family="Arial,sans-serif" font-size="19" fill="#052e2b" font-weight="700">Recast · $2,297/mo · ~$250 fee · save $348/mo</text></g><g transform="translate(0,148)"><rect x="0" y="0" width="622" height="42" rx="6" fill="url(#barRefi)"/><text x="14" y="28" font-family="Arial,sans-serif" font-size="19" fill="#081f44" font-weight="700">Refi 30-yr · $2,352/mo · ~$9,500 closing · save $293/mo</text></g><g transform="translate(0,206)"><text x="0" y="0" font-family="Arial,sans-serif" font-size="26" fill="#facc15" font-weight="800">Recast breaks even in &lt;1 month. Refi pays back in ~32.</text></g></g><text x="340" y="560" font-family="Arial,sans-serif" font-size="17" fill="#64748b">30-year fixed rate per Freddie Mac PMMS, week of Apr 16, 2026. Illustrative only — your numbers depend on lender policy.</text><text x="1100" y="600" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#64748b">MyCalcFinance</text></svg>
